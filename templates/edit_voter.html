{% extends "base.html" %}{% block title %}VoteLock | Edit Voter{% endblock %}{% block page_heading %}Edit Voter{% endblock %}{% block content %}<div class="form-page"><form method="post" class="panel form-card"><div class="form-section"><div class="section-icon">♙</div><div><span class="eyebrow">{{ voter['voter_id'] }}</span><h3>{{ voter['name'] }}</h3><p>Update registry details. Voting status remains unchanged.</p></div></div><div class="form-grid"><label>Full name<input name="name" value="{{ voter['name'] }}" required></label><label>Email<input type="email" name="email" value="{{ voter['email'] or '' }}"></label><label>Department / constituency<input name="department" value="{{ voter['department'] or '' }}"></label></div><div class="form-actions"><a class="secondary-btn" href="{{ url_for('voters.list_voters') }}">Cancel</a><button class="primary-btn">Save changes</button></div></form></div>{% endblock %}
