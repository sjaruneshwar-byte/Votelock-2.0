{% extends "base.html" %}{% block title %}VoteLock | Edit Candidate{% endblock %}{% block page_heading %}Edit Candidate{% endblock %}{% block content %}<div class="form-page"><form method="post" class="panel form-card"><div class="form-section"><div class="section-icon">◉</div><div><span class="eyebrow">{{ candidate['candidate_id'] }}</span><h3>Edit {{ candidate['name'] }}</h3></div></div><div class="form-grid"><label>Candidate name<input name="name" value="{{ candidate['name'] }}" required></label><label>Party / group<input name="party" value="{{ candidate['party'] or '' }}"></label><label>Symbol<input name="symbol" value="{{ candidate['symbol'] or '' }}"></label><label>Status<select name="status"><option {{ 'selected' if candidate['status']=='Active' else '' }}>Active</option><option {{ 'selected' if candidate['status']!='Active' else '' }}>Inactive</option></select></label></div><label>Description<textarea name="description" rows="4">{{ candidate['description'] or '' }}</textarea></label><div class="form-actions"><a class="secondary-btn" href="{{ url_for('candidates.list_candidates') }}">Cancel</a><button class="primary-btn">Save changes</button></div></form></div>{% endblock %}
